name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      generated_at: ${{ steps.metadata.outputs.generated_at }}

    steps:
      - name: Resolve release tag
        id: metadata
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "generated_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "${GITHUB_OUTPUT}"

      - name: Check out the immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Confirm the tag resolves to this workflow commit
        if: github.event_name == 'push'
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Record tagged source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag and synchronized version identities
        run: npm run release:verify-version -- --tag "${{ steps.metadata.outputs.tag }}"

      - name: Validate source-controlled model evidence
        run: npm run validate:artifacts

      - name: Run dependency advisory gate
        run: npm audit --audit-level=high

  windows:
    needs: verify
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signature.outputs.signed }}
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install the pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.3

      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject incomplete Windows signing configuration
        shell: pwsh
        run: |
          $configured = @(
            -not [string]::IsNullOrWhiteSpace($env:CSC_LINK),
            -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          )
          if ($configured -contains $true -and $configured -contains $false) {
            throw 'WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD must be configured together.'
          }

      - name: Build and test native Release targets
        shell: pwsh
        run: .\scripts\build.cmd

      - name: Verify the Windows interaction budget
        shell: pwsh
        run: |
          npm run performance:ci -- `
            --benchmark-executable build/ballistics_benchmarks.exe `
            --benchmark build/validation/benchmark.json `
            --engine build/stage/bin/ballistics_cli.exe `
            --output build/validation/interaction-performance.json `
            --iterations 5 `
            --attempts 2
          npm run performance:trend -- `
            --benchmark build/validation/benchmark.json `
            --history benchmarks/history.json `
            --output build/validation/benchmark-trend.json `
            --markdown build/validation/benchmark-trend.md
          npm run validation:summary
          npm run validation:summary:check

      - name: Run renderer and release-integrity tests
        run: npm test

      - name: Check formatting and build the Windows installer
        shell: pwsh
        run: |
          npm run format:check
          npm run package:win

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $executable = 'outputs\installer\win-unpacked\Ballistics Workbench.exe'
          $result = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -Wait -PassThru
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }
          npm run test:e2e:win

      - name: Verify Authenticode status
        id: signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem outputs\installer\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'The Windows installer was not produced.' }
          $requested = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          $signed = $signature.Status -eq 'Valid'
          if ($requested -and -not $signed) {
            throw "Authenticode validation failed: $($signature.Status) $($signature.StatusMessage)"
          }
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Record Windows toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          $compilerFile = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compilerFile) { throw 'Could not identify the release MSVC compiler.' }
          $compiler = "MSVC $($compilerFile.VersionInfo.ProductVersion)"
          $cmake = (cmake --version | Select-Object -First 1).Trim()
          $electron = node -p "require('./package.json').devDependencies.electron"
          $builder = node -p "require('./package.json').devDependencies['electron-builder']"
          node scripts/release/write-toolchain-fragment.mjs `
            --output outputs/release-fragments/windows-toolchain.json `
            --platform windows `
            --runner windows-latest `
            --architecture x64 `
            --compiler "$compiler" `
            --cmake "$cmake" `
            --node "$(node --version)" `
            --npm "$(npm --version)" `
            --electron "$electron" `
            --electron-builder "$builder" `
            --signed "${{ steps.signature.outputs.signed }}" `
            --notarized false `
            --notes "Authenticode is required when Windows signing secrets are configured."

      - name: Stage Windows release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            outputs/installer/*.exe
            outputs/release-fragments/windows-toolchain.json
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: verify
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signature.outputs.signed }}
      notarized: ${{ steps.signature.outputs.notarized }}
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.MACOS_INSTALLER_CSC_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MACOS_INSTALLER_CSC_KEY_PASSWORD }}
      MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install the pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.3

      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate signing and notarization configuration
        run: |
          application_certificate_values=("$CSC_LINK" "$CSC_KEY_PASSWORD" "$MACOS_IDENTITY")
          installer_certificate_values=(
            "$CSC_INSTALLER_LINK"
            "$CSC_INSTALLER_KEY_PASSWORD"
            "$MACOS_INSTALLER_IDENTITY"
          )
          apple_values=("$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID")
          application_certificate_count=0
          installer_certificate_count=0
          apple_count=0
          for value in "${application_certificate_values[@]}"; do
            [[ -n "$value" ]] && application_certificate_count=$((application_certificate_count + 1))
          done
          for value in "${installer_certificate_values[@]}"; do
            [[ -n "$value" ]] && installer_certificate_count=$((installer_certificate_count + 1))
          done
          for value in "${apple_values[@]}"; do [[ -n "$value" ]] && apple_count=$((apple_count + 1)); done
          [[ "$application_certificate_count" = 0 || "$application_certificate_count" = 3 ]] || {
            echo 'MACOS_CSC_LINK, MACOS_CSC_KEY_PASSWORD, and MACOS_IDENTITY must be configured together.' >&2
            exit 1
          }
          [[ "$installer_certificate_count" = 0 || "$installer_certificate_count" = 3 ]] || {
            echo 'MACOS_INSTALLER_CSC_LINK, MACOS_INSTALLER_CSC_KEY_PASSWORD, and MACOS_INSTALLER_IDENTITY must be configured together.' >&2
            exit 1
          }
          [[ "$application_certificate_count" = "$installer_certificate_count" ]] || {
            echo 'The application and installer certificate groups must be configured together.' >&2
            exit 1
          }
          [[ "$apple_count" = 0 || "$apple_count" = 3 ]] || {
            echo 'APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID must be configured together.' >&2
            exit 1
          }
          [[ "$apple_count" = 0 || "$application_certificate_count" = 3 ]] || {
            echo 'Notarization credentials require Developer ID Application and Installer certificates.' >&2
            exit 1
          }

      - name: Build and test universal native Release targets
        run: |
          node scripts/build/native-build.mjs --preset macos-universal --fresh
          archs="$(lipo -archs build/ballistics_cli)"
          echo "$archs" | grep -q x86_64
          echo "$archs" | grep -q arm64

      - name: Verify the macOS interaction budget
        run: |
          npm run performance:ci -- \
            --benchmark-executable build/ballistics_benchmarks \
            --benchmark build/validation/benchmark.json \
            --engine build/stage/bin/ballistics_cli \
            --output build/validation/interaction-performance.json \
            --iterations 5 \
            --attempts 2
          npm run performance:trend -- \
            --benchmark build/validation/benchmark.json \
            --history benchmarks/history.json \
            --output build/validation/benchmark-trend.json \
            --markdown build/validation/benchmark-trend.md
          npm run validation:summary
          npm run validation:summary:check

      - name: Run renderer and release-integrity tests
        run: npm test

      - name: Generate application icon
        run: |
          brew install librsvg
          bash scripts/make-icns.sh

      - name: Build universal macOS installers
        run: |
          npm run format:check
          npm run native:verify-stage -- --platform macos
          if [[ -n "$CSC_LINK" ]]; then
            codesign --force --options runtime --timestamp --sign "$MACOS_IDENTITY" build/stage/bin/ballistics_cli
            npm run build
            npx --no-install electron-builder --mac dmg pkg --universal --publish never \
              --config.mac.identity="$MACOS_IDENTITY" \
              --config.mac.notarize=false \
              --config.pkg.identity="$MACOS_INSTALLER_IDENTITY"
          else
            # Empty GitHub secret values are still exported as environment variables.
            # electron-builder treats an empty certificate link as the current directory,
            # so remove the signing variables entirely for the free unsigned build.
            unset CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD
            unset MACOS_IDENTITY MACOS_INSTALLER_IDENTITY
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            codesign --force --sign - build/stage/bin/ballistics_cli
            npm run package:mac
          fi

      - name: Verify the guided installer payload
        run: |
          pkg="$(find outputs/installer -maxdepth 1 -name '*.pkg' -type f | head -n1)"
          [[ -n "$pkg" ]]
          payload="$(pkgutil --payload-files "$pkg")"
          grep -q 'Ballistics Workbench.app/Contents/MacOS/Ballistics Workbench$' <<< "$payload"

      - name: Verify architecture and smoke-test packaged application
        run: |
          app="$(find outputs/installer -maxdepth 3 -name '*.app' -type d | head -n1)"
          [[ -n "$app" ]]
          for binary in \
            "$app/Contents/MacOS/Ballistics Workbench" \
            "$app/Contents/Resources/bin/ballistics_cli"; do
            archs="$(lipo -archs "$binary")"
            echo "$archs" | grep -q x86_64
            echo "$archs" | grep -q arm64
          done
          "$app/Contents/MacOS/Ballistics Workbench" --smoke-test
          node scripts/e2e/packaged-ui-smoke.mjs \
            --executable "$app/Contents/MacOS/Ballistics Workbench" \
            --output outputs/ui-smoke/macos

      - name: Verify signing and notarize when credentials are available
        id: signature
        run: |
          app="$(find outputs/installer -maxdepth 3 -name '*.app' -type d | head -n1)"
          dmg="$(find outputs/installer -maxdepth 1 -name '*.dmg' -type f | head -n1)"
          pkg="$(find outputs/installer -maxdepth 1 -name '*.pkg' -type f | head -n1)"
          [[ -n "$app" && -n "$dmg" && -n "$pkg" ]]
          signed=false
          notarized=false
          if [[ -n "$CSC_LINK" ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            pkgutil --check-signature "$pkg"
            signed=true
          fi
          if [[ -n "$APPLE_ID" ]]; then
            for installer in "$dmg" "$pkg"; do
              xcrun notarytool submit "$installer" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait
              xcrun stapler staple "$installer"
              xcrun stapler validate "$installer"
            done
            spctl --assess --type install --verbose=4 "$pkg"
            notarized=true
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"

      - name: Record macOS toolchain
        run: |
          compiler="$(c++ --version | head -n1)"
          cmake_version="$(cmake --version | head -n1)"
          electron="$(node -p "require('./package.json').devDependencies.electron")"
          builder="$(node -p "require('./package.json').devDependencies['electron-builder']")"
          node scripts/release/write-toolchain-fragment.mjs \
            --output outputs/release-fragments/macos-toolchain.json \
            --platform macos \
            --runner macos-latest \
            --architecture arm64+x86_64 \
            --compiler "$compiler" \
            --cmake "$cmake_version" \
            --node "$(node --version)" \
            --npm "$(npm --version)" \
            --electron "$electron" \
            --electron-builder "$builder" \
            --signed "${{ steps.signature.outputs.signed }}" \
            --notarized "${{ steps.signature.outputs.notarized }}" \
            --notes 'Developer ID signing and Apple notarization are enforced when credentials are configured.'

      - name: Stage macOS release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            outputs/installer/*.dmg
            outputs/installer/*.pkg
            outputs/release-fragments/macos-toolchain.json
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install the pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.3

      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test native Linux targets
        run: node scripts/build/native-build.mjs --preset linux-gcc --fresh

      - name: Verify Linux interaction budget and benchmark trend
        run: |
          npm run performance:ci -- \
            --benchmark-executable build/ballistics_benchmarks \
            --benchmark build/validation/benchmark.json \
            --engine build/stage/bin/ballistics_cli \
            --output build/validation/interaction-performance.json \
            --iterations 5 \
            --attempts 2
          npm run performance:trend -- \
            --benchmark build/validation/benchmark.json \
            --history benchmarks/history.json \
            --output build/validation/benchmark-trend.json \
            --markdown build/validation/benchmark-trend.md
          npm run validation:summary
          npm run validation:summary:check

      - name: Test, format-check, package, and smoke-test Linux application
        run: |
          npm test
          npm run format:check
          npm run package:linux
          xvfb-run --auto-servernum \
            outputs/installer/linux-unpacked/ballistics-workbench --smoke-test --no-sandbox
          xvfb-run --auto-servernum node scripts/e2e/packaged-ui-smoke.mjs \
            --executable outputs/installer/linux-unpacked/ballistics-workbench \
            --output outputs/ui-smoke/linux \
            --disable-sandbox

      - name: Record Linux toolchain
        run: |
          compiler="$(c++ --version | head -n1)"
          cmake_version="$(cmake --version | head -n1)"
          electron="$(node -p "require('./package.json').devDependencies.electron")"
          builder="$(node -p "require('./package.json').devDependencies['electron-builder']")"
          node scripts/release/write-toolchain-fragment.mjs \
            --output outputs/release-fragments/linux-toolchain.json \
            --platform linux \
            --runner ubuntu-latest \
            --architecture x64 \
            --compiler "$compiler" \
            --cmake "$cmake_version" \
            --node "$(node --version)" \
            --npm "$(npm --version)" \
            --electron "$electron" \
            --electron-builder "$builder" \
            --signed false \
            --notarized false \
            --notes 'Linux AppImage and tar.gz packages are unsigned and validated on Ubuntu x64.'

      - name: Stage Linux release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: |
            outputs/installer/*.AppImage
            outputs/installer/*.tar.gz
            outputs/release-fragments/linux-toolchain.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Download platform release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-input

      - name: Assemble checksums, SBOM, licenses, and release manifest
        run: |
          node scripts/release/generate-release-assets.mjs \
            --artifacts release-input \
            --output outputs/release \
            --tag '${{ needs.verify.outputs.tag }}' \
            --commit '${{ needs.verify.outputs.commit }}' \
            --repository '${{ github.repository }}' \
            --ref 'refs/tags/${{ needs.verify.outputs.tag }}' \
            --generated-at '${{ needs.verify.outputs.generated_at }}' \
            --toolchain release-input/release-windows/windows-toolchain.json \
            --toolchain release-input/release-macos/macos-toolchain.json \
            --toolchain release-input/release-linux/linux-toolchain.json
          npm run release:verify-assets -- --directory outputs/release

      - name: Upload final release bundle for retention
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: outputs/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
          MACOS_NOTARIZED: ${{ needs.macos.outputs.notarized }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          prerelease=false
          signing_note='Windows Authenticode and macOS Developer ID/notarization checks passed.'
          if [[ "$WINDOWS_SIGNED" != true || "$MACOS_SIGNED" != true || "$MACOS_NOTARIZED" != true ]]; then
            prerelease=true
            signing_note='Signing credentials were incomplete or unavailable. These artifacts are a pre-release. Inspect release-manifest.json before use.'
          fi
          release_title="Ballistics Workbench ${RELEASE_TAG#v}"
          release_notes="$signing_note SHA256SUMS.txt, the CycloneDX SBOM, dependency-license inventory, and traceable release manifest are attached."
          arguments=(
            "$RELEASE_TAG"
            outputs/release/*
            --verify-tag
            --title "$release_title"
            --generate-notes
            --notes "$release_notes"
          )
          [[ "$prerelease" = true ]] && arguments+=(--prerelease)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              if [[ ! -f "outputs/release/$asset" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" outputs/release/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$release_title" \
              --notes "$release_notes" \
              --prerelease="$prerelease"
          else
            gh release create "${arguments[@]}"
          fi
