name: Build and test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify synchronized release identities
        run: npm run release:verify-version

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM and license inventory
        run: |
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          npm run release:supply-chain -- \
            --output build/supply-chain \
            --commit "${GITHUB_SHA}" \
            --generated-at "${generated_at}"

      - name: Upload supply-chain reports
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: build/supply-chain/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.3

      - name: Install JavaScript and validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test the native core (GCC)
        run: |
          node scripts/build/native-build.mjs --preset linux-gcc --fresh
          ./build/ballistics_benchmarks --iterations 3 --output build/validation/benchmark.json
          npm run performance:assess -- \
            --benchmark build/validation/benchmark.json \
            --engine build/stage/bin/ballistics_cli \
            --output build/validation/interaction-performance.json \
            --iterations 3
          npm run performance:trend -- \
            --benchmark build/validation/benchmark.json \
            --history benchmarks/history.json \
            --output build/validation/benchmark-trend.json \
            --markdown build/validation/benchmark-trend.md

      - name: Validate source-controlled model evidence
        run: node validation/validate-artifacts.mjs

      - name: Generate aggregate validation summary
        run: |
          npm run validation:summary
          npm run validation:summary:check

      - name: Upload GCC numerical and benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-linux-gcc
          path: build/validation/*
          if-no-files-found: error

      - name: Type-check, unit-test, and build the renderer
        run: |
          npm test
          npm run build:web

      - name: Build and smoke-test Linux packages
        run: |
          npm run package:linux
          xvfb-run --auto-servernum \
            outputs/installer/linux-unpacked/ballistics-workbench --smoke-test --no-sandbox
          xvfb-run --auto-servernum node scripts/e2e/packaged-ui-smoke.mjs \
            --executable outputs/installer/linux-unpacked/ballistics-workbench \
            --output outputs/ui-smoke/linux \
            --disable-sandbox

      - name: Upload Linux packages and UI report
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: |
            outputs/installer/*.AppImage
            outputs/installer/*.tar.gz
            outputs/ui-smoke/linux/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.3

      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Build and test native targets
        run: .\scripts\build.cmd

      - name: Run native static analysis
        run: npm run lint:native -- --build-directory build

      - name: Generate MSVC benchmark report
        shell: pwsh
        run: |
          build\ballistics_benchmarks.exe --iterations 3 --output build\validation\benchmark.json
          npm run performance:assess -- `
            --benchmark build/validation/benchmark.json `
            --engine build/stage/bin/ballistics_cli.exe `
            --output build/validation/interaction-performance.json `
            --iterations 3
          npm run performance:trend -- `
            --benchmark build/validation/benchmark.json `
            --history benchmarks/history.json `
            --output build/validation/benchmark-trend.json `
            --markdown build/validation/benchmark-trend.md

      - name: Validate source-controlled model evidence
        run: npm run validate:artifacts

      - name: Generate aggregate validation summary
        run: |
          npm run validation:summary
          npm run validation:summary:check

      - name: Upload MSVC numerical and benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-windows-msvc
          path: build/validation/*
          if-no-files-found: error

      - name: Run web unit tests
        run: npm test

      - name: Build the Windows installer
        run: npm run package:win

      - name: Smoke-test the packaged app on Windows
        shell: pwsh
        run: |
          $exe = 'outputs\installer\win-unpacked\Ballistics Workbench.exe'
          $result = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          Write-Host "Smoke test exit code: $($result.ExitCode)"
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }

      - name: Exercise packaged UI and CSV export on Windows
        run: npm run test:e2e:win

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: outputs/installer/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.3

      - name: Install JavaScript and validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test the native core (Clang, universal)
        run: |
          node scripts/build/native-build.mjs --preset macos-universal --fresh
          ./build/ballistics_benchmarks --iterations 3 --output build/validation/benchmark.json
          npm run performance:assess -- \
            --benchmark build/validation/benchmark.json \
            --engine build/stage/bin/ballistics_cli \
            --output build/validation/interaction-performance.json \
            --iterations 3
          npm run performance:trend -- \
            --benchmark build/validation/benchmark.json \
            --history benchmarks/history.json \
            --output build/validation/benchmark-trend.json \
            --markdown build/validation/benchmark-trend.md
          echo "ballistics_cli architectures: $(lipo -archs build/ballistics_cli)"
          lipo -archs build/ballistics_cli | grep -q x86_64
          lipo -archs build/ballistics_cli | grep -q arm64

      - name: Validate source-controlled model evidence
        run: node validation/validate-artifacts.mjs

      - name: Generate aggregate validation summary
        run: |
          npm run validation:summary
          npm run validation:summary:check

      - name: Upload Clang numerical and benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-macos-clang
          path: build/validation/*
          if-no-files-found: error

      - name: Ad-hoc sign the native CLI
        run: codesign --force --sign - build/stage/bin/ballistics_cli

      - name: Run web unit tests
        run: npm test

      - name: Generate the application icon
        run: |
          brew install librsvg
          bash scripts/make-icns.sh

      - name: Build the macOS installers
        env:
          # Free ad-hoc signing only. No Apple Developer certificate is used.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac

      - name: Verify the guided installer payload
        run: |
          pkg="$(find outputs/installer -maxdepth 1 -name '*.pkg' -type f | head -n1)"
          [[ -n "$pkg" ]]
          payload="$(pkgutil --payload-files "$pkg")"
          grep -q 'Ballistics Workbench.app/Contents/MacOS/Ballistics Workbench$' <<< "$payload"

      - name: Verify the packaged app is universal (Intel + Apple Silicon)
        run: |
          app="$(find outputs/installer -maxdepth 3 -name '*.app' -type d | head -n1)"
          echo "Inspecting $app"
          for bin in \
            "$app/Contents/MacOS/Ballistics Workbench" \
            "$app/Contents/Resources/bin/ballistics_cli"; do
            archs="$(lipo -archs "$bin")"
            echo "  $bin -> $archs"
            echo "$archs" | grep -q x86_64
            echo "$archs" | grep -q arm64
          done

      - name: Smoke-test the packaged app on macOS
        run: |
          app="$(find outputs/installer -maxdepth 3 -name '*.app' -type d | head -n1)"
          echo "Launching $app --smoke-test"
          "$app/Contents/MacOS/Ballistics Workbench" --smoke-test
          node scripts/e2e/packaged-ui-smoke.mjs \
            --executable "$app/Contents/MacOS/Ballistics Workbench" \
            --output outputs/ui-smoke/macos

      - name: Upload the macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            outputs/installer/*.dmg
            outputs/installer/*.pkg
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==22.1.3

      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test with Clang ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: node scripts/build/native-build.mjs --preset linux-sanitizers --fresh --skip-install

      - name: Coverage-guide the protocol parser
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          npm run fuzz:protocol --
          --executable build/sanitizers/Ballistics.Protocol.Fuzz
          --corpus tests/Ballistics.Protocol.Fuzz/corpus
          --dictionary tests/Ballistics.Protocol.Fuzz/protocol.dict
          --artifacts build/fuzz-artifacts
          --seconds 60

      - name: Retain and minimize protocol-fuzzer failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzzer-failures
          path: build/fuzz-artifacts/*
          if-no-files-found: ignore
