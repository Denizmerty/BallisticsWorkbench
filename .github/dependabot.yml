version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    ignore:
      # Electron 44 embeds Node 24; advance this major only with the Electron runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      production-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-toolchain:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
